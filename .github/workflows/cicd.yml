name: argocd

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest 

    permissions: 
      contents: read
      packages: write

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: image build
      uses: mr-smithers-excellent/docker-build-push@v7
      with:
        image: kanna1718/argocd-flask-app
        tags: ${{ github.sha }}
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

  argocd:
    runs-on: ubuntu-latest
    needs: build
      
    steps:
    - name: write to another repo
      uses: actions/checkout@v4
      with:
        repository: Kanna1718/argocd
        token: ${{ secrets.PAT_TOKEN }} 
        path: .
        ref: main
      
    - name: update image tags
      run : |
        cd mainfests
        sed -i "s|image:.*|image: kanna1718/argocd-flask-app:${{ github.sha }}|g" deployment.yml

    - name: commit and push
      run: |
        cd mainfests
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add deployment.yml

        if ! git diff --cached --quiet; then
          git commit -m "chore(ci): update image tag to ${{ github.sha }}"
          git push origin main
        else
          echo "No changes detected. Skipping commit."
        fi

      
